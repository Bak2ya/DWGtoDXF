<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="DWG를 브라우저에서 로컬로 DXF로 변환하는 DWG2DXF 웹앱" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/app_logo.png" />
    <link rel="stylesheet" href="css/app.css" />
    <title>DWG2DXF</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <img src="assets/app_logo.png" alt="" />
            <strong>DWG2DXF</strong>
            <span>변환 엔진을 불러오는 중...</span>
            <div class="boot-progress"></div>
            <small>첫 실행은 브라우저에 WebAssembly 파일을 준비하느라 조금 더 걸릴 수 있습니다.</small>
        </div>
    </div>
    <div id="blazor-error-ui">
        오류가 발생했습니다. <a href="" class="reload">새로고침</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
        }
    </script>
</body>
</html>
